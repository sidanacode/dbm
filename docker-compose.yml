services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dbm
      POSTGRES_USER: dbm
      POSTGRES_PASSWORD: dbm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbm"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dbm-postgres:/var/lib/postgresql/data

  api:
    build: .
    command: ["dbm-api"]
    environment:
      DBM_DATABASE_URL: postgresql+psycopg://dbm:dbm@postgres:5432/dbm
      DBM_API_TOKEN: ${DBM_API_TOKEN:-dev-token}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp:
    build: .
    environment:
      DBM_COORDINATOR_URL: http://api:8000
      DBM_API_TOKEN: ${DBM_API_TOKEN:-dev-token}
      DBM_MCP_TRANSPORT: streamable-http
      DBM_MCP_HOST: 0.0.0.0
      DBM_MCP_PORT: 8001
      DBM_MCP_PATH: /mcp
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8001:8001"

volumes:
  dbm-postgres:

